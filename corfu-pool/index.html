tton id="zin">＋</button><button id="zout">－</button></div><div class="toast" id="toast"></div><script>(()=>{'use strict';const C=document.getElementById('c'),x=C.getContext('2d'),D=Math.min(2,devicePixelRatio||1);function rs(){C.width=innerWidth*D;C.height=innerHeight*D;C.style.width=innerWidth+'px';C.style.height=innerHeight+'px';x.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();setTimeout(()=>load.classList.add('off'),700);let yaw=-.55,pitch=.64,zoom=20,night=0,tour=0,build=0,sel='',last=performance.now(),phase=0;const made=[],toast=document.getElementById('toast');let tt;function msg(s){toast.textContent=s;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1600)}function P(a,b,c){const cy=Math.cos(yaw),sy=Math.sin(yaw),rx=a*cy-c*sy,rz=a*sy+c*cy,cp=Math.cos(pitch),sp=Math.sin(pitch),ry=b*cp-rz*sp,d=b*sp+rz*cp+zoom,q=880/(d+18);return[X=innerWidth/2+rx*q,Y=innerHeight/2-ry*q,q]}function poly(p,f,s){x.beginPath();p.forEach((v,i)=>{let q=P(...v);i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])});x.closePath();if(f){x.fillStyle=f;x.fill()}if(s){x.strokeStyle=s;x.stroke()}}function sh(h,m){let n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return'#'+((1<<24)+(Math.min(255,r*m)<<16)+(Math.min(255,g*m)<<8)+Math.min(255,b*m)|0).toString(16).slice(1)}function box(a,b,c,w,h,d,col){let A=[a,b,c],B=[a+w,b,c],E=[a,b+h,c],F=[a+w,b+h,c],G=[a,b,c+d],H=[a+w,b,c+d],I=[a,b+h,c+d],J=[a+w,b+h,c+d];poly([A,B,F,E],sh(col,.86),'#0002');poly([G,I,J,H],sh(col,.72),'#0002');poly([E,F,J,I],sh(col,1.06),'#0002')}function flat(a,c,w,d,col){poly([[a,0,c],[a+w,0,c],[a+w,0,c+d],[a,0,c+d]],col,'#0001')}function circ(a,b,c,rx,rz,col){let p=[];for(let i=0;i<20;i++){let t=i/20*Math.PI*2;p.push([a+Math.cos(t)*rx,b,c+Math.sin(t)*rz])}poly(p,col)}function umb(a,c){circ(a,.02,c,1.3,1,'#0002');box(a-.07,0,c-.07,.14,2.3,.14,'#eee');circ(a,2.4,c,1.55,1.55,'#fafafa')}function lou(a,c){circ(a,.01,c,1.25,.65,'#0002');box(a-1.1,.18,c-.42,2.2,.22,.84,'#ddd2c
